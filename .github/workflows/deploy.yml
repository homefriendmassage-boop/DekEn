name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Sub-path of the project site: https://<user>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # Set these under Settings > Secrets and variables > Actions
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_LIFF_ID: ${{ secrets.VITE_LIFF_ID }}
          VITE_PROMPTPAY_ID: ${{ secrets.VITE_PROMPTPAY_ID }}
          VITE_BANK_NAME: ${{ secrets.VITE_BANK_NAME }}
          VITE_BANK_ACCOUNT_NO: ${{ secrets.VITE_BANK_ACCOUNT_NO }}
          VITE_BANK_ACCOUNT_NAME: ${{ secrets.VITE_BANK_ACCOUNT_NAME }}
          VITE_LINE_OA_URL: ${{ secrets.VITE_LINE_OA_URL }}
          VITE_USE_MOCK_LIFF: 'false'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
